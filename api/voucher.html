<!DOCTYPE html>
<html lang="en-NG">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b7a3b">
  <title>Voucher Claimed Successfully</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #0b7a3b 0%, #095c2d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1a1a1a;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      max-width: 400px;
      width: 100%;
      padding: 40px 28px;
      text-align: center;
    }
    .check {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #e8f8ee;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .check svg { width: 40px; height: 40px; }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #0b7a3b;
      margin-bottom: 10px;
    }
    p {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .code {
      background: #f4f7f5;
      border: 1px dashed #0b7a3b;
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, monospace;
      font-size: 0.9rem;
      color: #0b7a3b;
      letter-spacing: 1px;
      margin-bottom: 24px;
      user-select: all;
    }
    .btn {
      display: inline-block;
      background: #0b7a3b;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 14px 28px;
      border-radius: 10px;
      width: 100%;
    }
    .note {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0b7a3b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Voucher Claimed Successfully</h1>
    <p>Your free bet voucher has been applied to your account and will be available on your next bet slip.</p>
    <div class="code">MSBET-2026-FREE</div>
    <a class="btn" href="https://www.msport.com/ng">Back to MSport</a>
    <div class="note">Voucher valid for 7 days. Terms apply.</div>
  </div>
</body>
</html>
